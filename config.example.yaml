# Copy to config.yaml and edit. config.yaml is gitignored — it may name
# internal apps and hosts, so it never goes near the repo.

daemon:
  host: "127.0.0.1"        # localhost only. Never bind 0.0.0.0 on a work machine.
  port: 8765
  db_path: "data/jarvis-work.db"

observer:
  interval_seconds: 5
  # Apps whose window titles are recorded but whose content is never captured.
  # Anything not on the allowlist still gets app-name-only tracking.
  capture_titles: true
  capture_clipboard: false   # off by default; opt in deliberately
  # Never record anything at all while one of these is frontmost.
  blind_apps:
    - "1Password"
    - "Bitwarden"
    - "KeePass"
    - "Keeper"
    - "Windows Security"
  # Titles matching these are stored as "(redacted)".
  blind_title_patterns:
    - "(?i)password"
    - "(?i)payroll"
    - "(?i)\\bssn\\b"

agent:
  # The Hyper-V VM running the second Claude Desktop. Filled in after the
  # VM is built — see docs/HYPER-V-SETUP.md.
  bridge_url: ""            # e.g. "http://192.168.0.42:8766"
  bridge_token: ""          # shared secret, must match the VM's config
  enabled: false            # flip to true once the bridge answers /health

mcp:
  # The MCP shim talks to the daemon over localhost. Usually leave as-is.
  daemon_url: "http://127.0.0.1:8765"

llm:
  # Jarvis's own brain. Sonnet handles the steady state, Opus is called in when
  # the cheap tier reports low confidence in its own answer.
  api_key: ""              # or set ANTHROPIC_API_KEY in the environment
  models:
    fast: "claude-haiku-4-5"
    default: "claude-sonnet-5"
    deep: "claude-opus-5"
  effort:
    fast: "low"
    default: "medium"
    deep: "high"
  escalate_below_confidence: 0.7
  max_tokens: 16000
  cache_ttl: "1h"
